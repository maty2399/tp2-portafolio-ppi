<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Dietética</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* El fondo general sigue siendo oscuro para combinar con tu web */
        body {
            background-color: #0f172a;
            color: #1e293b; /* Texto general oscuro para las tarjetas claras */
        }

        /* ACLARAMOS LAS TARJETAS: Ahora son de un gris clarito muy elegante */
        .card-light {
            background-color: #f8fafc; 
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Títulos principales dentro de las tarjetas */
        .titulo-tarjeta {
            color: #0f172a !important;
            font-weight: 700;
        }

        /* Subtítulos o etiquetas */
        .label-tarjeta {
            color: #334155 !important;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* INPUTS BLANCOS Y LIMPIOS: Máxima legibilidad */
        .form-control-custom {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Efecto celeste cuando hacés clic para escribir */
        .form-control-custom:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important;
        }

        /* Marcador de posición (placeholder) */
        .form-control-custom::placeholder {
            color: #94a3b8;
        }

        /* Textos secundarios del detalle */
        .text-muted-custom {
            color: #64748b !important;
        }

        /* Botón de enviar con un lindo azul brillante */
        .btn-enviar-pedido {
            background-color: #2563eb !important;
            border: none;
            color: white !important;
            transition: background-color 0.2s;
        }

        .btn-enviar-pedido:hover {
            background-color: #1d4ed8 !important;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <form id="form-carrito" class="row g-4">
            
            <section class="col-lg-8 col-md-12">
                <div class="card-light p-4 h-100">
                    <h4 class="text-uppercase text-secondary fs-6 fw-bold mb-4 titulo-tarjeta" style="letter-spacing: 0.1em;">Tus Datos:</h4>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label label-tarjeta">Nombre Completo</label>
                            <input type="text" id="nombre" class="form-control form-control-custom p-2" required placeholder="Ingresá tu nombre">
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label label-tarjeta">Teléfono de contacto</label>
                            <input type="tel" id="telefono" class="form-control form-control-custom p-2" required placeholder="Ej: 261XXXXXXX">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label label-tarjeta">Email</label>
                        <input type="email" id="email" class="form-control form-control-custom p-2" required placeholder="tu@email.com">
                    </div>

                    <div class="mb-2">
                        <label for="comentarios" class="form-label label-tarjeta">Comentarios o notas adicionales</label>
                        <textarea id="comentarios" class="form-control form-control-custom p-2" rows="4" placeholder="Notas sobre el envío o productos..."></textarea>
                    </div>
                </div>
            </section>

            <aside class="col-lg-4 col-md-12">
                <div class="card-light p-4">
                    <h5 class="fw-bold mb-3 pb-2 border-bottom border-2 titulo-tarjeta fs-6">Detail de tu pedido</h5>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted-custom">Unidades:</span>
                        <strong id="carrito-unidades" class="text-dark">0</strong>
                    </div>
                    
                    <div class="d-flex justify-content-between pt-3 border-top border-2 mb-3">
                        <span class="text-muted-custom fw-semibold">Total:</span>
                        <div class="text-end">
                            <span id="carrito-total" class="d-block fs-3 fw-bold text-dark">$ 0,00</span>
                            <span id="carrito-iva" class="text-danger small fw-bold" style="display: none;">Precios no incluyen IVA</span>
                        </div>
                    </div>

                    <p class="text-muted-custom small lh-sm mb-4">
                        Al continuar aceptas nuestras políticas de privacidad y condiciones de venta.
                    </p>

                    <div id="contenedor-accion-carrito">
                        <button type="submit" class="btn btn-enviar-pedido w-100 rounded-pill fw-bold py-2 shadow-sm" id="btn-enviar">
                            Enviar Pedido
                        </button>
                    </div>
                </div>
            </aside>

        </form>
    </div>

    <script>
        document.getElementById('form-carrito').addEventListener('submit', function(event) {
            event.preventDefault(); 
            const contenedorAccion = document.getElementById('contenedor-accion-carrito');
            contenedorAccion.innerHTML = `
                <div class="alert alert-success text-center fw-bold border-success m-0 shadow-sm" style="background-color: #d1fae5; color: #065f46;">
                    ✨ Muchas gracias, estamos procesando su pedido.
                </div>
            `;
        });
    </script>

</body>
</html>
