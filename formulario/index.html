<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Dietética Natural</title>
 
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos propios -->
    <link href="formulario.css" rel="stylesheet"/>
</head>
<body>
 
    <!-- Encabezado -->
    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold" style="color: #f8fafc;">Dietética Natural</h1>
            <p style="color: #94a3b8;">Completá el formulario y nos ponemos en contacto con vos</p>
        </div>
 
        <!-- Formulario de contacto -->
        <form id="form-contacto" class="row justify-content-center">
            <div class="col-lg-7 col-md-10">
                <div class="card-light p-4">
 
                    <h4 class="text-uppercase fs-6 fw-bold mb-4 titulo-tarjeta" style="letter-spacing: 0.1em;">
                        Tus datos:
                    </h4>
 
                    <!-- Fila: nombre y teléfono -->
                    <div class="row g-3 mb-3">
 
                        <!-- Nombre - required: campo obligatorio -->
                        <div class="col-md-6">
                            <label for="nombre" class="form-label label-tarjeta">Nombre Completo *</label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                class="form-control form-control-custom p-2"
                                required
                                placeholder="Ingresá tu nombre">
                        </div>
 
                        <!-- Teléfono - type tel: acepta formato de teléfono -->
                        <div class="col-md-6">
                            <label for="telefono" class="form-label label-tarjeta">Teléfono de contacto *</label>
                            <input
                                type="tel"
                                id="telefono"
                                name="telefono"
                                class="form-control form-control-custom p-2"
                                required
                                placeholder="Ej: 261XXXXXXX">
                        </div>
 
                    </div>
 
                    <!-- Email - type email: valida formato automáticamente -->
                    <div class="mb-3">
                        <label for="email" class="form-label label-tarjeta">Email *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control form-control-custom p-2"
                            required
                            placeholder="tu@email.com">
                    </div>
 
                    <!-- Dropdown: motivo de consulta -->
                    <div class="mb-3">
                        <label for="motivo" class="form-label label-tarjeta">Motivo de consulta *</label>
                        <select
                            id="motivo"
                            name="motivo"
                            class="form-select form-control-custom p-2"
                            required>
                            <option value="" disabled selected>Seleccioná una opción</option>
                            <option value="productos">Productos disponibles</option>
                            <option value="precios">Precios</option>
                            <option value="envios">Envíos</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
 
                    <!-- Mensaje -->
                    <div class="mb-3">
                        <label for="mensaje" class="form-label label-tarjeta">Mensaje</label>
                        <textarea
                            id="mensaje"
                            name="mensaje"
                            class="form-control form-control-custom p-2"
                            rows="4"
                            placeholder="Escribí tu consulta acá..."></textarea>
                    </div>
 
                    <!-- Checkbox: términos y condiciones - required: obligatorio -->
                    <div class="mb-4">
                        <div class="form-check">
                            <input
                                type="checkbox"
                                id="terminos"
                                name="terminos"
                                class="form-check-input"
                                required>
                            <label for="terminos" class="form-check-label label-tarjeta">
                                Acepto los términos y condiciones *
                            </label>
                        </div>
                    </div>
 
                    <!-- Botón enviar: dispara el modal si el formulario es válido -->
                    <button type="submit" class="btn btn-enviar-pedido w-100 rounded-pill fw-bold py-2 shadow-sm">
                        Enviar consulta
                    </button>
 
                </div>
            </div>
        </form>
    </div>
 
    <!-- Modal de confirmación de envío -->
    <div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="modalExitoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius: 16px;">
                <!-- Ícono de éxito -->
                <div class="mb-3" style="font-size: 3rem;">✅</div>
                <h5 class="fw-bold mb-2" id="modalExitoLabel">¡Consulta enviada!</h5>
                <p class="text-muted mb-4">Gracias por contactarte. Te respondemos a la brevedad.</p>
                <!-- Botón para cerrar el modal -->
                <button type="button" class="btn btn-enviar-pedido rounded-pill fw-bold px-4" data-bs-dismiss="modal">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
 
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
    <script>
        // Al enviar el formulario: valida con HTML5 y muestra el modal si todo está correcto
        document.getElementById('form-contacto').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita que la página se recargue
            var modal = new bootstrap.Modal(document.getElementById('modalExito'));
            modal.show(); // Muestra el modal de confirmación
            this.reset(); // Limpia el formulario
        });
    </script>
 
</body>
</html>
